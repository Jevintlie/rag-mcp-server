[project]
name = "sunway-rag-mcp"
version = "0.1.0"
description = "Retrieval-augmented MCP server for structured university programme information"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv==1.2.1",
  "sentence-transformers==5.1.2",
  "chromadb==1.3.5",
  "beautifulsoup4==4.14.2",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
sunway-rag-mcp = "rag_mcp.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
